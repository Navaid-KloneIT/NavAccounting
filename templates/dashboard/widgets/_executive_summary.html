<div class="card border-0 shadow-sm h-100">
    <div class="card-header bg-transparent border-0">
        <h5 class="card-title mb-0">Executive Summary</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="border rounded p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Accounts Receivable</span>
                        <span class="fw-semibold">${{ ar_total|default:"45,200" }}</span>
                    </div>
                    <div class="progress" style="height: 6px;">
                        <div class="progress-bar bg-primary" style="width: 68%"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="border rounded p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Accounts Payable</span>
                        <span class="fw-semibold">${{ ap_total|default:"28,100" }}</span>
                    </div>
                    <div class="progress" style="height: 6px;">
                        <div class="progress-bar bg-warning" style="width: 45%"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="border rounded p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Profit Margin</span>
                        <span class="fw-semibold text-success">{{ profit_margin|default:"24.5" }}%</span>
                    </div>
                    <div class="progress" style="height: 6px;">
                        <div class="progress-bar bg-success" style="width: 24.5%"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="border rounded p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">Budget Utilized</span>
                        <span class="fw-semibold">{{ budget_utilized|default:"73" }}%</span>
                    </div>
                    <div class="progress" style="height: 6px;">
                        <div class="progress-bar bg-info" style="width: 73%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
