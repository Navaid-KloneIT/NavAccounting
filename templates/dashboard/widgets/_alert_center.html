<div class="card border-0 shadow-sm h-100">
    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Alerts</h5>
        <span class="badge bg-danger">{{ alert_count|default:"0" }}</span>
    </div>
    <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
        {% for alert in alerts %}
        <div class="d-flex align-items-start p-3 border-bottom">
            <div class="me-2">
                <i class="bi bi-circle-fill text-{{ alert.severity }}" style="font-size: 0.5rem;"></i>
            </div>
            <div>
                <h6 class="mb-1 small">{{ alert.title }}</h6>
                <p class="text-muted small mb-0">{{ alert.message|truncatewords:10 }}</p>
            </div>
        </div>
        {% empty %}
        <div class="text-center text-muted p-3">
            <p class="mb-0 small">No active alerts</p>
        </div>
        {% endfor %}
    </div>
</div>
