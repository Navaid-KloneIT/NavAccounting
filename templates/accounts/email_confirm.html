{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email - NavAccounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --nav-primary: #3b7ddd; --nav-primary-dark: #2f64b1; }
        body { background-color: #f3f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 420px; width: 100%; border: none; border-radius: 12px; }
        .auth-card .card-body { padding: 2.5rem; }
        .btn-primary { background-color: var(--nav-primary); border-color: var(--nav-primary); }
        .btn-primary:hover { background-color: var(--nav-primary-dark); border-color: var(--nav-primary-dark); }
    </style>
</head>
<body>
    <div class="auth-card card shadow-sm">
        <div class="card-body text-center">
            <div class="mb-4">
                <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">Confirm Email Address</h4>
            {% if confirmation %}
            <p class="text-muted mb-4">
                Please confirm that <strong>{{ confirmation.email_address.email }}</strong>
                is your email address.
            </p>
            <form method="post" action="{% url 'account_confirm_email' confirmation.key %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary py-2 px-4">
                    <i class="bi bi-check-lg me-1"></i> Confirm Email
                </button>
            </form>
            {% else %}
            <p class="text-muted mb-4">
                This confirmation link is invalid or has expired.
            </p>
            <a href="{% url 'account_login' %}" class="btn btn-primary">
                Go to Sign In
            </a>
            {% endif %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
