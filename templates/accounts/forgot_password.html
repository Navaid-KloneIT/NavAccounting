{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NavAccounting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --nav-primary: #3b7ddd; --nav-primary-dark: #2f64b1; }
        body { background-color: #f3f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 420px; width: 100%; border: none; border-radius: 12px; }
        .auth-card .card-body { padding: 2.5rem; }
        .auth-logo {
            width: 48px; height: 48px; background: var(--nav-primary);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }
        .btn-primary { background-color: var(--nav-primary); border-color: var(--nav-primary); }
        .btn-primary:hover { background-color: var(--nav-primary-dark); border-color: var(--nav-primary-dark); }
        .form-control:focus { border-color: var(--nav-primary); box-shadow: 0 0 0 0.2rem rgba(59, 125, 221, 0.25); }
    </style>
</head>
<body>
    <div class="auth-card card shadow-sm">
        <div class="card-body">
            <div class="auth-logo">
                <i class="bi bi-key"></i>
            </div>
            <h4 class="text-center mb-1">Forgot Password?</h4>
            <p class="text-center text-muted mb-4">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="id_email" name="email"
                               placeholder="Enter your registered email" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="bi bi-send me-1"></i> Send Reset Link
                </button>
            </form>

            <p class="text-center text-muted mt-3 mb-0">
                Remember your password?
                <a href="{% url 'account_login' %}" class="text-primary text-decoration-none fw-semibold">
                    Sign In
                </a>
            </p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
