{% extends "base.html" %}

{% block layout %}
<!-- Detached Layout -->
<div class="container-fluid">
    {% include "partials/_topbar.html" %}
</div>

<div class="container-fluid">
    <div class="row">
        <!-- Detached Sidebar -->
        <div class="col-auto">
            <div class="detached-sidebar">
                {% include "partials/_sidebar.html" %}
            </div>
        </div>

        <!-- Main Content -->
        <div class="col">
            <div class="main-content main-content-detached">
                <div class="page-content">
                    <div class="container-fluid">
                        {% include "partials/_page_title.html" %}
                        {% include "partials/_alerts.html" %}
                        {% block content %}{% endblock %}
                    </div>
                </div>

                {% include "partials/_footer.html" %}
            </div>
        </div>
    </div>
</div>
<!-- End Detached Layout -->
{% endblock %}
